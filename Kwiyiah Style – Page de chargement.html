<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kwiyiah Style – Chargement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blanc:#ffffff;
    --noir:#14110d;
    --or:#b08d4f;
    --or-sombre:#9a6f2e;
    --gris:#7d7569;
    --ligne:#e8e3d8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:#ffffff;
    color:var(--noir);
    font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3.2vh,34px);overflow:hidden;
  }
  .rang{
    display:flex;justify-content:center;align-items:flex-end;
    width:100%;padding:0 4vw;
  }
  .rang figure{margin:0;flex:0 1 auto;position:relative;animation:fadeUp 0.6s ease-out}
  .rang img{
    height:clamp(200px,46vh,480px);
    width:auto;max-width:92vw;display:block;object-fit:contain;
    filter:drop-shadow(0 14px 18px rgba(60,40,20,.12));
  }
  @media (max-width:560px){
    .rang img{height:min(34vh,240px)}
  }

  .chargeur{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .logo{position:relative;width:clamp(62px,8.5vw,84px);aspect-ratio:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.08))}
  .logo svg{position:absolute;inset:0;width:100%;height:100%}
  .anneau{animation:tourne 1.7s linear infinite}
  .trait{stroke-dasharray:1;stroke-dashoffset:1;animation:trace 2.4s ease-in-out infinite}
  .trait:nth-child(2){animation-delay:.15s}
  .trait:nth-child(3){animation-delay:.30s}

  .marque-bloc{display:flex;flex-direction:column;align-items:center;gap:4px}
  .marque{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:500;
    font-size:clamp(21px,2.6vw,29px);
    letter-spacing:.20em;
    text-transform:uppercase;
    margin:0;
    color:var(--noir);
    line-height:1.1;
  }
  .marque span{color:var(--or);font-style:italic}
  .sous-titre{
    font-family:'Archivo',sans-serif;
    font-size:9.5px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--or-sombre);
    margin:0;
    font-weight:500;
  }

  .barre{width:clamp(130px,16vw,190px);height:2px;background:var(--ligne);overflow:hidden;border-radius:99px;margin:3px 0}
  .barre span{
    display:block;height:100%;width:45%;
    background:linear-gradient(90deg,transparent,var(--or) 50%,var(--noir) 80%,transparent);
    animation:glisse 1.4s ease-in-out infinite;
  }
  .etat{font-weight:300;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris);margin:0}

  @keyframes tourne{to{transform:rotate(360deg)}}
  @keyframes trace{0%{stroke-dashoffset:1}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
  @keyframes glisse{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){
    .anneau,.barre span{animation:none}
    .trait{animation:none;stroke-dashoffset:0}
  }
</style>
</head>
